name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run pack
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF_NAME#v}
          NOTES=docs/RELEASE-v$V.md
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" "dist/usage-ledger-$V.zip" --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "dist/usage-ledger-$V.zip" --title "$GITHUB_REF_NAME" --generate-notes
          fi
