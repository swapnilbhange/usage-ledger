name: Bug report
description: Something does not work, or a number looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Most live-site behaviour was only tested on mock pages, so reports from real use are very valuable.
  - type: dropdown
    id: site
    attributes:
      label: Site
      options: [claude.ai, chatgpt.com, gemini.google.com, Dashboard only, Other]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on chrome://extensions
      placeholder: "0.3.1"
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 131 on Windows 11"
    validations: { required: true }
  - type: dropdown
    id: symptom
    attributes:
      label: What happened
      options:
        - The bar floats in a corner instead of sitting under the message box
        - It says it could not read the chat
        - A token count looks wrong
        - Session / Weekly numbers look wrong (claude.ai)
        - Dashboard problem
        - Something else
    validations: { required: true }
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What did you expect, and what did you see? If a count looks wrong, say how you compared it and which model was selected.
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes:
      label: Copy diagnostics output
      description: Click the bar, press "Copy diagnostics" (shown when a chat cannot be read), and paste here. It contains page structure only, never message text. Please check it before posting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included message text, API keys or personal information.
          required: true
