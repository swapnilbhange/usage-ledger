name: Feature request
description: An idea for Usage Ledger
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the solution.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you do today instead?
  - type: markdown
    attributes:
      value: Please check [ROADMAP.md](https://github.com/swapnilbhange/usage-ledger/blob/main/ROADMAP.md) first. It may already be planned, or listed under "Not planned".
